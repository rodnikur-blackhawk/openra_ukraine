# --- changes to world.yaml

^BaseWorld:
	Faction@ukraine:
		Side: Allies
		Description: faction-ukraine-zsu.description
	Faction@randomallies:
		RandomFactionMembers: england, france, germany, ukraine
	Faction@randomsoviet:
		RandomFactionMembers: russia

World:
	StartingUnits@lightsoviet:
		Factions: soviet, russia
	StartingUnits@heavysoviet:
		Factions: soviet, russia
	StartingUnits@lightukraine:
