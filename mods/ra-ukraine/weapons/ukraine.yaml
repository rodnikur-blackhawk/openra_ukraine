# Ratel S triggers. Vehicles: it goes off right next to them (1c0, so the
# charge destroys them in one hit). Buildings: the attack range is measured to
# the centre of the building and the Ratel cannot drive into it, so - like the
# stock Demo Truck (DemoTruckTargeting) - it goes off within 2c0, from the cell
# next to a 3x3 Construction Yard.
RatelTargeting:
	ValidTargets: Vehicle
	Range: 1c0
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		ValidTargets: Vehicle

RatelTargeting.Buildings:
	ValidTargets: Structure
	Range: 2c0
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		ValidTargets: Structure

# Ratel S charge. Units: unchanged, anything it reaches is destroyed in one hit
# (28000 at up to 1000% close in). Buildings (Warhead@1DamBuildings): half of
# the building's full health, whatever the building - two Ratels take down a
# Construction Yard or any other building.
RatelCharge:
	ValidTargets: Ground, GroundActor, Trees, Water, WaterActor
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 28000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, Trees, WaterActor
		InvalidTargets: Structure
		Versus:
			None: 90
			Wood: 100
			Light: 100
			Heavy: 100
			Concrete: 60
		AffectsParent: true
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@1DamBuildings: HealthPercentageDamage
		Spread: 1c512
		Damage: 50
		ValidTargets: Structure
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		Size: 2
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom22.aud
		ImpactActors: false

