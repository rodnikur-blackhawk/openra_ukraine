# "Flamingo" cruise-missile launch position: replaces the Missile Silo. The strike
# hits like the GDI Ion Cannon (devastating in a small area, no fallout) and
# recharges faster than the atom bomb. Same building stats as the Missile Silo.
#
# Build limit: 4 pads. For reference, total damage dealt over the hit area
# (damage x area, summed over all warheads, before armour modifiers):
#   Atomic (5 warheads, 15000 + 4x 6000, out to 6-30 cells) ~ 13.76M
#   FlamingoStrike (10000 x1000% to 1c1, 250% at 2c1, 100% at 2c512) ~ 0.99M
# so a full match for one atom bomb would take ~14 pads; 4 was chosen as the
# balanced limit (a 4-missile salvo, each missile far deadlier at its point).
# AllowMultiple gives every pad its own charge timer and its own button, so all
# 4 missiles can be fired at once; without it the pads would share a single
# missile.
FLAMINGO:
	Inherits: ^ScienceBuilding
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown
	Inherits@shape: ^2x1Shape
	Valued:
		Cost: 2500
	Tooltip:
		Name: actor-flamingo.name
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 140
		Prerequisites: stek.ukraine, ~structures.ukraine, ~techlevel.unrestricted
		BuildLimit: 4
		Description: actor-flamingo.description
	Building:
		Footprint: xx
		Dimensions: 2,1
	Health:
		HP: 100000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 5c0
		Range: 6c0
		RequiresCondition: !disabled
		RevealGeneratedShroud: False
	RevealsShroud@Offline:
		Range: 5c0
		RequiresCondition: disabled
	RevealsShroud@GAPGEN:
		Range: 5c0
		RequiresCondition: !disabled
	SupportPowerChargeBar:
	InfiltrateForSupportPowerReset:
		Types: SpyInfiltrate
		PlayerExperience: 10
	Targetable:
		TargetTypes: GroundActor, C4, DetonateAttack, Structure, SpyInfiltrate
	Power:
		Amount: -150
	MustBeDestroyed:
		RequiredForShortGame: false
	WithSupportPowerActivationAnimation:
		RequiresCondition: !build-incomplete
	Selectable:
		Class: flamingo
		Bounds: 2048, 1024
	NukePower@flamingo:
		# own order name, so the AI uses the Flamingo with its own decision (below)
		# and the stock "nukepower" decision keeps serving the Soviet atom bomb
		OrderName: FlamingoStrike
		PauseOnCondition: disabled
		AllowMultiple: True
		Cursor: nuke
		Icon: flamingo
		ChargeInterval: 6000
		Name: actor-flamingo.power-name
		Description: actor-flamingo.power-description
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		BeginChargeTextNotification: notification-flamingo-prepping
		EndChargeTextNotification: notification-flamingo-ready
		IncomingTextNotification: notification-flamingo-launch-detected
		MissileWeapon: FlamingoStrike
		MissileImage: flamingo.missile
		MissileDelay: 5
		SpawnOffset: 0,-427,600
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayBeacon: True
		DisplayRadarPing: True
		BeaconPoster: flamingoicon
		CameraRange: 10c0
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SupportPowerPaletteOrder: 70
	RenderSprites:
		Image: flamingo

# The Ukrainian airfield calls in a Storm Shadow cruise missile instead of parabombs.
# It keeps the parabombs order name, so the AI keeps using it the same way.
# It has no Spy Plane, and the Paratroopers are replaced by a Mi-8 air assault:
# the power drops an invisible marker (heliassault.marker) on the chosen cell and
# scripts/ukraine-heliassault.lua flies in two Mi-8s that land there, unload
# 8 infantry and fly back off the map.
AFLD.Ukraine:
	Buildable:
		Description: actor-afld-ukraine-zsu.description
	-AirstrikePower@parabombs:
	# switched off for Ukraine by prerequisite rather than removed, because some
	# campaign maps remove these powers from AFLD.Ukraine in their own rules
	AirstrikePower@spyplane:
		Prerequisites: aircraft.soviet, !aircraft.ukraine
	ParatroopersPower@paratroopers:
		Prerequisites: aircraft.soviet, !aircraft.ukraine
	SpawnActorPower@heliassault:
		OrderName: UkraineHeliAssault
		Prerequisites: aircraft.ukraine
