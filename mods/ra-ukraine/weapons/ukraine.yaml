# "Lyutyi" kamikaze drone: when it reaches the target it dives onto it (the drone
# itself becomes this projectile, see LYUTYI in rules/ukraine.yaml).
# Buildings (Warhead@1Dam): a direct hit deals 112500 = 75% of a Construction
# Yard (FACT, 150000 HP, Wood); every other building takes the same damage, so
# anything with up to 112500 HP (power plants, barracks, refinery, radar, tech
# center, airfield, defences...) is destroyed by one hit.
# Units (Warhead@1DamUnits): a direct hit takes half the HP of a Heavy Tank
# (3TNK, 60000: 112500 x 27% = 30375) and kills the infantry in all 8 cells
# around the impact, diagonal ones included (112500 x 40% = 45000 at the centre,
# 60% at 0c768, 30% at 1c256, 12% at 1c768: at least ~7000 to a soldier in a
# diagonal cell, more than any rifleman or rocket soldier has), nothing past 2c0.
# The real Lyutyi carries a small (50-75 kg) warhead, so the blast on buildings
# stays tight: full damage to 0c512, 50% at 0c768, 10% at 1c256, nothing past
# 1c512.
Lyutyi.Strike:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	ReloadDelay: 100
	Range: 2c512
	Report: missile7.aud
	Projectile: Bullet
		Image: lyutyi
		Speed: 320
		Inaccuracy: 0
		Blockable: false
		Shadow: true
		TrailImage: smokey
	Warhead@1Dam: SpreadDamage
		Range: 0, 0c512, 0c768, 1c256, 1c512
		Falloff: 100, 100, 50, 10, 0
		Damage: 112500
		ValidTargets: Structure
		Versus:
			None: 100
			Wood: 100
			Light: 100
			Heavy: 100
			Concrete: 100
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@1DamUnits: SpreadDamage
		Range: 0, 0c512, 0c768, 1c256, 1c768, 2c0
		Falloff: 100, 100, 60, 30, 12, 0
		Damage: 112500
		ValidTargets: GroundActor, WaterActor, Trees
		InvalidTargets: Structure
		Versus:
			None: 40
			Wood: 100
			Tree: 100
			Light: 27
			Heavy: 27
			Concrete: 100
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		Size: 2
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom25.aud
		ValidTargets: Ground, GroundActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
		InvalidTargets: Bridge

