Lyutyi.Strike:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	ReloadDelay: 100
	Range: 2c512
	Report: missile7.aud
	Projectile: Bullet
		Image: lyutyi
		Speed: 320
		Inaccuracy: 0
		Blockable: false
		Shadow: true
		TrailImage: smokey
	Warhead@1Dam: SpreadDamage
		Spread: 1
		Damage: 64500
		ValidTargets: Structure
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@1DamUnits: SpreadDamage
		Range: 0, 0c512, 0c768, 1c256, 1c768, 2c0
		Falloff: 100, 100, 60, 30, 12, 0
		Damage: 75000
		ValidTargets: GroundActor, WaterActor, Trees
		InvalidTargets: Structure, LyutyiPatrolBoat
		Versus:
			None: 40
			Wood: 100
			Tree: 100
			Light: 27
			Heavy: 27
			Concrete: 100
		DamageTypes: TriggerProne, ExplosionDeath
	# Direct contact only. The preceding warheads still handle all splash damage.
	Warhead@DirectVehicle: HealthPercentageDamage
		Spread: 1
		Damage: 150
		ValidTargets: Vehicle
		InvalidTargets: Structure, Ship, MammothTank
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@DirectMammoth: TargetDamage
		Spread: 1
		# 75% of 90,000 HP, less the 20,250 Heavy-armor damage at the impact.
		Damage: 47250
		ValidTargets: MammothTank
		DamageTypes: TriggerProne, ExplosionDeath
	# Keep the usual falloff beyond the point where it could sink the patrol boat in one hit.
	Warhead@PatrolBoat: SpreadDamage
		Range: 0, 0c525, 0c768, 1c256, 1c768, 2c0
		Falloff: 98, 98, 60, 30, 12, 0
		Damage: 75000
		ValidTargets: LyutyiPatrolBoat
		Versus:
			Heavy: 27
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		Size: 2
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom25.aud
		ValidTargets: Ground, GroundActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
		InvalidTargets: Bridge

