AFLD.Ukraine:
	Buildable:
		Description: actor-afld-ukraine-zsu.description
	Tooltip:
		Name: actor-afld-ukraine-zsu.name
	Exit@1:
		RequiresCondition: !being-captured
		ExitCell: 1,1
		Facing: 768
		Priority: 2
		ProductionTypes: Plane, Aircraft
	# The airfield holds two aircraft: one on the landing pad (F-16 / TB2, the
	# stock Reservable pad) and one Lyutyi on the catapult. The catapult stands
	# on the apron next to the hangar, off the runway. A Lyutyi waiting on it
	# marks the airfield "catapult-loaded" (ProximityExternalCondition on
	# LYUTYI), which closes the Lyutyi exit until it has been launched.
	# The catapult cell (top right) is left out of the footprint: an aircraft
	# standing on an occupied airfield cell takes the airfield's landing pad
	# for itself (and the next aircraft built there pushes it into the air),
	# so the Lyutyi waits on a cell of its own and the pad stays for the F-16.
	Building:
		Footprint: xx_ xxx
		Dimensions: 3,2
	ExternalCondition@CATAPULT:
		Condition: catapult-loaded
	Exit@2:
		RequiresCondition: !being-captured
		# world offset (east, south, up), unlike the overlay offset below:
		# over the catapult, in the cell left out of the footprint
		SpawnOffset: 853,-640,0
		ExitCell: 2,0
		Facing: 256
		Priority: 1
		ProductionTypes: Lyutyi
	# Lyutyi drones come out of a production of their own, paused while the
	# catapult holds one: the next Lyutyi waits in the queue
	Production:
		Produces: Aircraft, Plane
	Production@CATAPULT:
		Produces: Aircraft, Lyutyi
		PauseOnCondition: catapult-loaded
	WithIdleOverlay@CATAPULT:
		Image: afld.catapult
		Sequence: idle
		# body offset: on the apron at the right end, off the runway and clear
		# of the F-16 parked in the middle, over the catapult cell left out of
		# the footprint (where the Lyutyi stands)
		Offset: 640,853,0
		RequiresCondition: !build-incomplete
	-AirstrikePower@parabombs:
	AirstrikePower@spyplane:
		Prerequisites: aircraft.soviet, !aircraft.ukraine
	ParatroopersPower@paratroopers:
		Prerequisites: aircraft.soviet, !aircraft.ukraine
	SpawnActorPower@heliassault:
		OrderName: UkraineHeliAssault
		Prerequisites: aircraft.ukraine
		Actor: heliassault.marker
		LifeTime: 50
		Terrain: Clear, Rough, Road, Ore, Gems, Beach
