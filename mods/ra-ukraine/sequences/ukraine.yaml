# Sprites for the Ukrainian (ZSU) roster. Files live in ra|bits/ukraine.
# uavop/gur: the stock rifleman (e1.shp, same frame layout) with their kit painted on.
# btr4/bulat/oplot/gepard: like the stock tank turrets, the turret frames carry no shadow
# (it would land on the hull); bulat/oplot/gepard turrets also have a dark rim like the
# stock Light Tank turret (tools/ukraine-sprites/outline_turret.py).

btr152:
	Defaults:
		Filename: btr152.shp
		Facings: -32
	idle:
	fire:
		Start: 32
		Length: 9
		Transpose: True
		Tick: 40
	passengers-1:
		Start: 320
		ZOffset: 16
	passengers-2:
		Start: 352
		ZOffset: 16
	passengers-3:
		Start: 384
		ZOffset: 16
	passengers-4:
		Start: 416
		ZOffset: 16
	passengers-5:
		Start: 448
		ZOffset: 16
	muzzle:
		# These frames are positioned at the barrel tip for each of the body facings.
		Start: 480
		Length: 6
		Transpose: True
		Tick: 40
		ZOffset: 64
	icon:
		Filename: btr152icon.shp
		Facings: 1

