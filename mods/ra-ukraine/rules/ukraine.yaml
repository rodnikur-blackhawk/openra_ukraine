	Buildable:
		BuildPaletteOrder: 40
		BuildAtProductionType: Lyutyi
		Prerequisites: ~afld, stek.ukraine, ~aircraft.ukraine, ~techlevel.high
		Description: actor-lyutyi.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-lyutyi.name
	Health:
		HP: 3500
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
	RevealsShroud@GAPGEN:
		Range: 4c0
	Armament:
		Weapon: Lyutyi.Strike
		LocalOffset: 0,0,0
		-MuzzleSequence:
	-WithMuzzleOverlay:
	AttackAircraft:
		FacingTolerance: 48
	Aircraft:
		Speed: 110
		TurnSpeed: 16
		# waits on the catapult of its airfield (its landing spot) until it is
		# sent at a target; the catapult cell is not part of the airfield, so
		# it stands there on the ground
		TakeOffOnCreation: false
		LandableTerrainTypes: Clear, Rough, Road, Ore, Gems, Beach, Bridge
	AmmoPool:
		Ammo: 1
	-WithAmmoPipsDecoration:
	-Contrail:
	-EjectOnDeath:
	# on the catapult it lies on the launch rail, nose up along it ("rail"
	# sequence); in the air the normal sprite and its shadow
	WithFacingSpriteBody:
		RequiresCondition: airborne
	WithFacingSpriteBody@RAIL:
		Name: rail
		Sequence: rail
		RequiresCondition: !airborne
	WithShadow:
		RequiresCondition: airborne
	# spent in its strike, so it needs no landing pad to rearm: the airfield's
	# pad stays for the F-16 / TB2 (and the Lyutyi does not count against it
	# in the bots' aircraft limit)
	-Rearmable:
	ProximityExternalCondition@CATAPULT:
		Condition: catapult-loaded
		Range: 1c256
		ValidRelationships: Ally
		RequiresCondition: !airborne
	GrantConditionOnAttack@STRIKE:
		Condition: striking
		ArmamentNames: primary
	KillsSelf@STRIKE:
		RequiresCondition: striking
		RemoveInstead: true
	SpawnActorOnDeath:
		Actor: LYUTYI.Husk
		RequiresCondition: airborne && !striking
	LeavesTrails:
		Offsets: -420,0,0
	Selectable:
		DecorationBounds: 1280, 1024, 0, 85

