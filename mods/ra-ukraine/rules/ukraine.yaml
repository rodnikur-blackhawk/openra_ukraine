			flamingo: 12
			pokrova: 1
	BaseBuilderBotModule@naval:
		BuildingLimits:
			flamingo: 4
			pokrova: 1
		BuildingFractions:
			flamingo: 10
			pokrova: 1

# Drone bunker: replaces the Flame Tower; same stats, launches FPV drones.
DBNK:
	Inherits: FTUR
	Buildable:
		BuildPaletteOrder: 60
		Prerequisites: barr.ukraine, ~structures.ukraine, ~techlevel.low
		Description: actor-dbnk.description
	Tooltip:
		Name: actor-dbnk.name
	# every launch: the roof hatch opens and the drone climbs out (sequence
	# "fire", 8 frames x 2 ticks); the FPV.Bunker drone leaves when the sprite
	# drone is at the top (frame 4 = tick 8)
	Armament:
		Weapon: FPV.Bunker
		LocalOffset: 0,0,420
		FireDelay: 8
	WithAttackAnimation:
		Sequence: fire

# Stugna-P ATGM position: replaces the Tesla Coil; same cost, armour and power
# draw (shuts down without power), rotating missile launcher.
STUGNA:
	Inherits: GUN
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown
	Buildable:
		BuildPaletteOrder: 80
		Prerequisites: weap, ~structures.ukraine, ~techlevel.medium
		Description: actor-stugna.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: actor-stugna.name
	RevealsShroud:
		MinRange: 6c0
		Range: 8c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 6c0
	Turreted:
		TurnSpeed: 32
	Armament:
		Weapon: Stugna.ATGM
		LocalOffset: 512,0,420
		MuzzleSequence: muzzle
	AttackTurreted:
		PauseOnCondition: disabled || build-incomplete
	Power:
		Amount: -80
	DetectCloaked:
		Range: 6c0
		RequiresCondition: !disabled
	# spelled out in full: the partial definition from ^DisableOnLowPowerOrPowerDown
	# would otherwise replace the one inherited through GUN
	WithBuildingRepairDecoration:
		Image: allyrepair
		Sequence: repair
		Position: Center
		Palette: player
		IsPlayerPalette: True
		Offsets:
			powerdown: -10, 0

