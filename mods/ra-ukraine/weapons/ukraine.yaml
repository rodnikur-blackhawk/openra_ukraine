# Flamingo cruise missile: modelled on the GDI Ion Cannon (Tiberian Dawn) -
# 10x damage inside one cell, falling off to 2.5 cells, no radiation.
FlamingoStrike:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Underwater, AirborneActor, Trees
	Warhead@1Dam_impact: SpreadDamage
		Range: 0, 1c1, 2c1, 2c512
		Damage: 10000
		Falloff: 1000, 1000, 250, 100
		ValidTargets: GroundActor, WaterActor, Underwater, AirborneActor, Trees
		AffectsParent: True
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu_impact: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground, Infantry
		Size: 2
	Warhead@3Res_impact: DestroyResource
		Size: 1
	Warhead@4Eff_impact: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom22.aud
		ImpactActors: false
	Warhead@5Eff_fire: CreateEffect
		Explosions: large_napalm
		ImpactSounds: firebl3.aud
		Delay: 4
		ImpactActors: false

# Storm Shadow: ONE precision cruise missile with a penetrating warhead (the
# real one carries a 450 kg BROACH tandem warhead, GPS/INS plus an imaging
# seeker that hits within a few metres, and is built for hardened, high-value
# targets: command posts, bunkers, depots, ships). In the game it is a point
# strike on a single target: 120000 damage to whatever stands in the aim cell
# (full damage only a quarter cell past the target's edge, nothing from 0c512,
# so buildings and units in the neighbouring cells are untouched), the same
# against every kind of armour - so it destroys any
# building up to 120000 HP (all but the Construction Yard and War Factory, which
# are left at 20%), any defence or air-defence site, a tank or a ship. Infantry
# take only 10% (it is no anti-personnel weapon).
# For comparison: the Lyutyi drone (75 kg warhead) takes 75% off a Construction
# Yard, but it is slow and can be shot down; this missile cannot be stopped.
StormShadow:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	Warhead@1Dam: SpreadDamage
		Range: 0, 0c256, 0c512
		Falloff: 100, 100, 0
		Damage: 120000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 10
			Wood: 100
			Light: 100
			Heavy: 100
			Concrete: 100
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom25.aud
		ValidTargets: Ground, GroundActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: small_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
