# "Lyutyi" long-range kamikaze drone. Flies to the target like a plane; once
# within 2.5 cells it dives onto it: the drone leaves the map and continues as
# the Lyutyi.Strike projectile (weapons/ukraine.yaml), so each drone hits once.
# Shot down on the way it crashes as a husk without the warhead going off.
# Like the real one (piston engine, about 200 km/h, navigation camera only) it is
# slower than the Bayraktar TB2, sees little around itself and is easy prey for
# air defence.
LYUTYI:
	Inherits: YAK
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~afld, stek.ukraine, ~aircraft.ukraine, ~techlevel.high
		Description: actor-lyutyi.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-lyutyi.name
	Health:
		HP: 3500
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
	RevealsShroud@GAPGEN:
		Range: 4c0
	Armament:
		Weapon: Lyutyi.Strike
		LocalOffset: 0,0,0
		-MuzzleSequence:
	-WithMuzzleOverlay:
	AttackAircraft:
		FacingTolerance: 48
	Aircraft:
		Speed: 110
		TurnSpeed: 16
	AmmoPool:
		Ammo: 1
	-WithAmmoPipsDecoration:
	-Contrail:
	-EjectOnDeath:
	# the dive: firing grants "striking", which removes the drone at once (no
	# death, no husk); the projectile carries on to the target
	GrantConditionOnAttack@STRIKE:
		Condition: striking
		ArmamentNames: primary
	KillsSelf@STRIKE:
		RequiresCondition: striking
		RemoveInstead: true
	SpawnActorOnDeath:
		Actor: LYUTYI.Husk
		RequiresCondition: airborne && !striking
	LeavesTrails:
		Offsets: -420,0,0
	Selectable:
		DecorationBounds: 1280, 1024, 0, 85

