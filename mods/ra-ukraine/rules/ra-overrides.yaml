		ClassName: options-starting-units.light-support
		Factions: ukraine
		BaseActor: mcv
		SupportActors: e1,e1,e1,e3.ukraine,uavop,btr4
		InnerSupportRadius: 3
		OuterSupportRadius: 5
	StartingUnits@heavyukraine:
		Class: heavy
