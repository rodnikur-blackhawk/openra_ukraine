# Proving ground: the stock air assault script plus the range script.
World:
	LuaScript:
		Scripts: ukraine-heliassault.lua, ukraine-flamingo.lua, ua-polygon.lua

# no fog, whole map revealed, no victory screen (there is no real enemy)
Player:
	DeveloperMode:
		CheckboxEnabled: True
		CheckboxLocked: True
		FastBuild: True
	-ConquestVictoryConditions:
	Shroud:
		FogCheckboxEnabled: False
		FogCheckboxLocked: True
		ExploredMapCheckboxEnabled: True
		ExploredMapCheckboxLocked: True

# airfield powers keep their normal recharge (Mi-8: 5 min, like the Paratroopers)
# but are ready at the start
AFLD.Ukraine:
	SpawnActorPower@heliassault:
		StartFullyCharged: True
	NukePower@stormshadow:
		StartFullyCharged: True
