	-ClassicFacingBodyOrientation:
	BodyOrientation:
	RenderSprites:
		Image: mi8

# --- AI: build and use the Ukrainian superweapons --------------------------
# The Storm Shadow strike reuses the stock "parabombs" decision (same order name).
#
# Flamingo: the missile is deadly in a small area (full damage to 1c1, 250% to
# 2c1, 100% to 2c512) and flies for 16 seconds, so the bot aims it at the densest
# value of enemy structures within 2 cells and keeps it 3 cells away from its own
# and allied troops and buildings. Pads that are ready together fire together at
# the same spot: two missiles are needed to destroy a Construction Yard.
#
# Pokrova: the field is dropped only where the bot's (or an ally's) own units are
# fighting: units that fired within the last 5 seconds are targetable as
# "InCombat" (rules/electronic-warfare.yaml), and the bot picks the spot with the
# most value of such units within the field radius. Firing means enemies are in
# weapon range, so the field also jams them; an idle army (e.g. gathered in the
# base) no longer draws the field.
#
# Building: a BuildingFractions value N lets the bot add another pad while
# pads x 100 <= N x (all its buildings), so with 10 the 2nd, 3rd and 4th pads come
# at 10, 20 and 30 buildings (with 1, as before, it never built a 2nd one).
#
# Unit production of Ukrainian bots: separate UnitBuilderBotModule instances,
# enabled only when the bot plays Ukraine (GrantConditionOnFaction on the player
# actor), so the Allied and Soviet bots keep the stock mix. UnitsToBuild is the
# share of the army each unit type should make up; the order follows the
# doctrine of the faction - drones first, kamikaze drones everywhere:
#   infantry: UAV operator (FPV) > rifleman > rocket soldier > engineer > HUR agent
#   vehicles: Vilkha > Gepard > Bulat > BTR-4 > Ratel S > Oplot > Bohdana
#             (+ a couple of minelayers, like the real Ukrainian minefields);
#             the BTR-4s ferry the infantry to the front, a few are enough
#   aircraft: Bayraktar TB2 (scouting and strikes) > Lyutyi > F-16
#             (interceptors)
#   ships:    Sea Baby > corvette
# How the drones, the BTR-4, the artillery, the HUR agents and the F-16 are
# used is up to scripts/ukraine-ai.lua.
# UAV operators need a Drone Bunker, so the bots also build it early (dbnk in
# BaseBuilderBotModule, ra-overrides.yaml).
Player:
	GrantConditionOnFaction@UKRAINEBOT:
		Condition: ukraine-faction
		Factions: ukraine
	UnitBuilderBotModule@rush:
		RequiresCondition: enable-rush-ai && !ukraine-faction
	UnitBuilderBotModule@normal:
		RequiresCondition: enable-normal-ai && !ukraine-faction
	UnitBuilderBotModule@turtle:
		RequiresCondition: enable-turtle-ai && !ukraine-faction
	UnitBuilderBotModule@naval:
		RequiresCondition: enable-naval-ai && !ukraine-faction
	UnitBuilderBotModule@rush-ukraine:
		RequiresCondition: enable-rush-ai && ukraine-faction
		UnitsToBuild:
			uavop: 60
			e1: 50
			e3: 30
			e6: 8
			gur: 5
			harv: 10
			btr4: 30
			vilkha: 40
			gepard: 32
			bulat: 30
			ratel: 25
			oplot: 20
			bohdana: 15
			# its single airfield builds only TB2s, a limited number
			tb2: 10
		UnitLimits:
			e6: 2
			gur: 3
			harv: 8
			btr4: 3
			gepard: 4
			ratel: 6
			tb2: 2
	UnitBuilderBotModule@normal-ukraine:
		RequiresCondition: enable-normal-ai && ukraine-faction
		UnitsToBuild:
			uavop: 60
			e1: 50
			e3: 30
			e6: 8
			gur: 5
			harv: 15
			btr4: 30
			vilkha: 40
			gepard: 32
			bulat: 30
			ratel: 25
			oplot: 20
			bohdana: 15
			mnly: 3
			tb2: 30
			lyutyi: 25
			f16: 12
			seababy: 20
			mazepa: 10
		UnitLimits:
			e6: 2
			gur: 3
			harv: 8
			btr4: 4
			gepard: 5
			ratel: 6
			mnly: 2
			tb2: 6
			f16: 4
			mazepa: 3
	UnitBuilderBotModule@turtle-ukraine:
		RequiresCondition: enable-turtle-ai && ukraine-faction
		UnitsToBuild:
			uavop: 60
			e1: 50
			e3: 30
			e6: 8
			gur: 5
			harv: 15
			btr4: 30
			vilkha: 45
			gepard: 40
			bulat: 30
			ratel: 25
			oplot: 20
			bohdana: 25
			mnly: 4
			tb2: 30
			lyutyi: 25
			f16: 18
			seababy: 20
			mazepa: 10
		UnitLimits:
			e6: 2
			gur: 3
			harv: 8
			btr4: 3
			gepard: 6
			ratel: 6
			mnly: 3
			tb2: 6
			f16: 6
			mazepa: 3
	UnitBuilderBotModule@naval-ukraine:
		RequiresCondition: enable-naval-ai && ukraine-faction
		UnitsToBuild:
			harv: 1
			gepard: 30
			vilkha: 20
			tb2: 45
			lyutyi: 35
			f16: 15
			seababy: 50
			mazepa: 35
		UnitLimits:
			harv: 4
			gepard: 3
			vilkha: 2
			f16: 4
		UnitDelays:
			harv: 10000
	SupportPowerBotModule:
		Decisions:
			flamingo:
				OrderName: FlamingoStrike
				MinimumAttractiveness: 2000
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 2c0
				Consideration@2:
					Against: Ally
					Types: GroundActor, WaterActor
					Attractiveness: -10
					TargetMetric: Value
					CheckRadius: 3c0
			# Storm Shadow (stock "parabombs" decision, same order name): a single
			# precise missile, so aim it at the most valuable single enemy
			# structure (worth 1000 or more), never next to own troops
			parabombs:
				MinimumAttractiveness: 1000
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 0c512
				Consideration@2:
					Against: Ally
					Types: GroundActor, WaterActor
					Attractiveness: -10
					TargetMetric: Value
					CheckRadius: 1c0
			# same targeting as the stock Paratroopers decision
			heliassault:
				OrderName: UkraineHeliAssault
				MinimumAttractiveness: 5
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 8c0
				Consideration@2:
					Against: Enemy
					Types: Water
					Attractiveness: -5
					TargetMetric: None
					CheckRadius: 8c0
			pokrova:
				OrderName: PokrovaEWField
				MinimumAttractiveness: 2000
				Consideration@1:
					Against: Ally
					Types: InCombat
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 4c512
	BaseBuilderBotModule@rush:
		BuildingLimits:
			flamingo: 4
			pokrova: 1
		BuildingFractions:
			flamingo: 10
			pokrova: 1
	BaseBuilderBotModule@normal:
		BuildingLimits:
			flamingo: 4
