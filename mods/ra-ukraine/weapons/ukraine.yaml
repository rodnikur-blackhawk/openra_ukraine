# F-16 air-superiority fighter: AIM-120 AMRAAM air-to-air missiles (in Ukraine
# the F-16s mostly defend the sky: they shoot down aircraft, cruise missiles and
# attack drones). Air targets only. Longer reach than a SAM Site (Nike, 7c512)
# and a fast, agile missile: two hits bring down a Yak or MiG, three a Hind.
AIM-120:
	Inherits: ^AntiAirMissile
	ReloadDelay: 30
	Range: 9c0
	MinRange: 1c0
	Report: missile6.aud
	Projectile: Missile
		Image: MISSILE
		Speed: 420
		Inaccuracy: 0
		HorizontalRateOfTurn: 60
		RangeLimit: 14c0
	Warhead@1Dam: SpreadDamage
		Damage: 5000

# WaterActor: also naval yards and other buildings standing in the water.
# Range 1c512: ships cannot share a cell, so the drone has to go off from the
# next cell (1c0 away, 1c448 diagonally); with 0c768 it never reached a ship
# that stood still. The charge (SeaBabyCharge) still deals ~290% of its damage
# at 1c0 and ~160% at 1c448.
SeaBabyTargeting:
	ValidTargets: Ship, Bridge, WaterActor
	Range: 1c512
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		ValidTargets: Ship, Bridge, WaterActor

SeaBabyCharge:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Underwater
	Warhead@1Dam: SpreadDamage
		Spread: 768
		Damage: 32000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Underwater, Bridge
		Versus:
			Wood: 100
			Light: 100
			Heavy: 100
			Concrete: 300
		AffectsParent: true
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@3Eff: CreateEffect
		Explosions: artillery_explosion
		ImpactSounds: kaboom15.aud
		ImpactActors: false
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water
		ImpactActors: false

